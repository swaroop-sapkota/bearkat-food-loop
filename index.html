const $=id=>document.getElementById(id), day='2026-11-25', tomorrow='2026-11-26';const seed=()=>({offers:[{id:1,business:'Pine Street Market',person:'Jordan Lee',contact:'jordan@example.invalid',address:'100 Sample Lane',food:'Sealed produce boxes',quantity:'8 boxes',storage:'Chilled, labeled',date:day,start:'14:00',end:'15:00',recurring:'One-time',notes:'Use rear receiving door',status:'Accepted, needs coverage',history:['Offer accepted by staff']},{id:2,business:'Oak Corner Bakery',food:'Packaged bread',quantity:'12 bags',date:tomorrow,start:'10:00',end:'11:00',status:'Awaiting review',history:['Offer submitted']}],shifts:[{id:11,title:'Pantry sorting',date:day,start:'11:00',end:'12:00',type:'Sorting',location:'Campus pantry (demo)',capacity:3,people:[],backup:[],status:'Open'},{id:12,title:'Market pickup',date:day,start:'14:00',end:'15:00',type:'Pickup',location:'Huntsville area',capacity:1,people:[],backup:[],driver:true,offer:1,status:'Open'},{id:13,title:'Pack grocery bags',date:tomorrow,start:'10:00',end:'11:00',type:'Packing',location:'Campus pantry (demo)',capacity:1,people:['Maya'],backup:[],status:'Assigned'},{id:14,title:'Stock shelves',date:tomorrow,start:'13:00',end:'14:00',type:'Stocking',location:'Campus pantry (demo)',capacity:1,people:['Alex'],backup:[],status:'Full'},{id:15,title:'Resource outreach',date:tomorrow,start:'15:00',end:'16:00',type:'Outreach',location:'Campus (demo)',capacity:2,people:[],backup:[],status:'Cancelled'}],alerts:[],completions:[],availability:['Wednesday','Thursday','Friday'],willing:false,requested:false,notify:true,info:{hours:'Hours pending official verification',contact:'Contact details pending verification',address:'Address pending verification',links:'Official resource links pending verification',faq:'Contact pantry staff for current eligibility and visit guidance.',announcement:'Welcome! This is a sample coordination platform.',expiry:'2026-12-31'}});let s;try{s=JSON.parse(localStorage.getItem('bfl-v1'))||seed()}catch{s=seed()}let role='Public',page='Home',calMonth="2026-11",viewMode="Calendar";const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('bfl-v1',JSON.stringify(s))}catch{}};function msg(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function update(t){save();render();if(t)msg(t)}function resetDemo(){if(confirm('Reset all sample changes?')){s=seed();save();switchRole('Public')}}function switchRole(r){role=r;$('role').value=r;page=r==='Public'?'Home':r==='Volunteer'?'My Dashboard':'Overview';render()}function go(p){page=p;render()}const btn=(t,fn,primary=false)=>`<button ${primary?'class="primary"':''} onclick="${fn}">${t}</button>`;const tag=t=>`<span class="tag">${esc(t)}</span>`;const field=(n,l,v='',type='text',req=true)=>`<label>${l}<input name="${n}" type="${type}" value="${esc(v)}" ${req?'required':''}></label>`;const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');function openModal(html){$('modal').innerHTML=html+`<div class="actions">${btn('Close',"$('modal').close()")}</div>`;$('modal').showModal()}function close(){ if($('modal').open) $('modal').close() }function status(x){return x.status==='Cancelled'?'Cancelled':x.people.length>=x.capacity?(x.people.includes('Maya')?'Assigned':'Full'):'Open'}function duration(x){let m=t=>{let [h,n]=t.split(':').map(Number);return h*60+n};return m(x.end)-m(x.start)}function eligible(name,x){if(x.driver&&name==='Maya')return false;if(name==='Maya'&&!s.availability.includes(new Date(x.date+'T12:00').toLocaleDateString('en-US',{weekday:'long'})))return false;return !s.shifts.some(y=>y.id!==x.id&&y.status!=='Cancelled'&&y.people.includes(name)&&y.date===x.date&&y.start<x.end&&x.start<y.end)}function shiftCard(x){return `<div class="card"><div>${tag(status(x))}</div><h3>${esc(x.title)}</h3><p>${x.date} · ${x.start}–${x.end} · ${duration(x)} min<br>${esc(x.location)}<br>${Math.max(0,x.capacity-x.people.length)} open spaces · ${x.driver?'Approved driver required':'General orientation'}</p>${btn('View shift',`details(${x.id})`)}</div>`}function details(id){let x=s.shifts.find(y=>y.id===id),o=s.offers.find(y=>y.id===x.offer);openModal(`<h2>${esc(x.title)}</h2><p>${x.date} · ${x.start}–${x.end}</p><p>${x.driver?'Collect food and deliver to pantry within the assigned window. Driver approval required.':'Check in with pantry staff and follow task instructions.'}</p><p>Cancel from My Shifts if you cannot attend. Backups attend only after staff confirmation.</p>${role==='Volunteer'&&x.people.includes('Maya')?`<p>${esc(o?.address||'Campus pantry (demo)')} · ${esc(x.instructions||o?.notes||'Check in with staff')}</p>`:''}<div class="actions">${x.status==='Cancelled'?'This shift is cancelled.':btn('Sign up',`signup(${id},false)`,true)+btn('Join backup list',`signup(${id},true)`)}</div>`)}function signup(id,backup){let x=s.shifts.find(y=>y.id===id);if(role==='Public'){close();switchRole('Volunteer');details(id);return}if(x.driver){openAgain(`<h2>Driver approval is required for this shift.</h2><p>Staff must verify driver eligibility before assignment.</p>${btn('Request approval','requestApproval()',true)} ${btn('Browse other tasks',"close();go('Browse Shifts')")}`);return}if(x.status==='Cancelled'||x.people.includes('Maya')||x.backup.includes('Maya'))return msg('Already registered or unavailable');if(!backup&&(!eligible('Maya',x)||x.people.length>=x.capacity))return msg('Shift full or conflicts with availability');(backup?x.backup:x.people).push('Maya');close();go('My Dashboard');update(backup?'Backup requested; do not attend until confirmed.':'Shift added to My Shifts')}function openAgain(h){close();openModal(h)}function requestApproval(){s.requested=true;s.alerts.push({text:'Maya requested driver approval',page:'Volunteers'});close();update('Simulated approval request sent')}function cancelShift(id){openModal(`<h2>Cancel this shift?</h2><label>Optional reason<textarea id="reason"></textarea></label>${btn('Confirm cancellation',`doCancel(${id})`,true)}`)}function doCancel(id){let x=s.shifts.find(y=>y.id===id);x.people=x.people.filter(n=>n!=='Maya');x.confirmed=false;s.alerts.push({text:x.title+' cancelled by Maya. '+$('reason').value,page:'Schedule',id});let o=s.offers.find(y=>y.id===x.offer);if(o){o.status='Accepted, needs coverage';o.history.push('Maya cancelled')}close();update('Cancellation recorded; staff alerted')}function complete(id){openModal(`<h2>Submit completion</h2><form onsubmit="submitCompletion(event,${id})">${field('hours','Hours worked','1','number')}<label>Outcome<select name="outcome"><option>Collected / completed</option><option>Unable to collect</option></select></label><label>Notes / reason<textarea name="notes"></textarea></label><button class="primary">Submit for verification</button></form>`)}function submitCompletion(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(+f.hours<=0||+f.hours>24)return msg('Enter valid hours');s.completions.push({...f,id,person:'Maya',verified:false});let x=s.shifts.find(y=>y.id===id),o=s.offers.find(y=>y.id===x.offer);if(o)o.status=f.outcome==='Unable to collect'?'Unable to collect':'Collected';close();update('Pending verification')}function verify(i){let c=s.completions[i];c.verified=true;let x=s.shifts.find(y=>y.id===c.id),o=s.offers.find(y=>y.id===x.offer);if(o){o.status=c.outcome==='Unable to collect'?'Unable to collect':'Received and verified';o.history.push('Staff verified completion and hours')}update('Receipt and hours verified')}
function offerForm(){return `<h2>Offer a retailer pickup</h2><p>For ordinary drop-off or monetary gifts, use the <a href="https://www.shsu.edu/academics/colleges/health-sciences/food-pantry" target="_blank" rel="noopener">official pantry website</a>. This form is a simulated coordination request.</p><p>Offers are reviewed by pantry staff. Submission does not guarantee acceptance or pickup.</p><form onsubmit="submitOffer(event)"><div class="grid">${field('business','Business name')}${field('person','Contact person')}${field('contact','Email or phone')}${field('address','Pickup address')}${field('food','Food description')}${field('quantity','Approximate quantity')}${field('storage','Storage and label information')}${field('date','Pickup date',day,'date')}${field('start','Earliest pickup','14:00','time')}${field('end','Latest pickup','15:00','time')}<label>Frequency<select name="recurring"><option>One-time</option><option>Recurring</option></select></label></div><label>Optional notes<textarea name="notes"></textarea></label><button class="primary">Submit offer</button></form>`}function submitOffer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.end<=f.start)return msg('Latest pickup must be after earliest pickup');s.offers.push({...f,id:Date.now(),status:'Awaiting review',history:['Offer submitted']});if($('modal').open)close();go(role==='Staff'?'Donations':'Home');update('Sample offer submitted for staff review')}
function review(id){let o=s.offers.find(x=>x.id===id);openModal(`<h2>${esc(o.business)}</h2><p>${esc(o.food)} · ${esc(o.quantity)}<br>${esc(o.person)} · ${esc(o.contact)}<br>${esc(o.address)}<br>${esc(o.storage)}<br>${o.date} ${o.start}–${o.end}<br>${esc(o.notes)}</p><p>${tag(o.status)}</p><h3>Activity history</h3><p>${o.history.map(esc).join('<br>')}</p><div class="actions">${btn('Accept offer',`decision(${id},'Accepted, needs coverage')`,true)}${btn('Request information',`decision(${id},'Awaiting review')`)}${btn('Decline',`decision(${id},'Declined')`)}${o.status==='Accepted, needs coverage'?btn('Create pickup',`close();createShift(${id})`):''}</div>`)}function decision(id,t){let o=s.offers.find(x=>x.id===id);o.status=t;o.history.push(t==='Awaiting review'?'Information requested (simulated)':t);close();update('Offer updated')}function createShift(id=0){let o=s.offers.find(x=>x.id===id);if(o&&s.shifts.some(x=>x.offer===id&&x.status!=='Cancelled')){close();go('Schedule');return msg('Pickup already exists; assign it in Schedule')}openModal(`<h2>Create ${o?'pickup':'shift'}</h2><form onsubmit="submitShift(event,${id})">${field('title','Task name',o?'Pickup: '+o.business:'')}${field('date','Date',o?.date||day,'date')}${field('start','Start / pickup',o?.start||'10:00','time')}${field('end','End / delivery',o?.end||'11:00','time')}<label>Task type<select name="type">${opts(['Pickup','Sorting','Stocking','Packing','Outreach'],o?'Pickup':'Sorting')}</select></label>${field('location','General location','Huntsville area')}${field('capacity','Spaces','1','number')}<label><input style="width:auto" type="checkbox" name="driver" ${o?'checked':''}> Approved driver required</label><label>Instructions<textarea name="instructions"></textarea></label><button class="primary">Create task</button></form>`)}function submitShift(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.end<=f.start||+f.capacity<1)return msg('Check time window and capacity');s.shifts.push({...f,id:Date.now(),offer:id,capacity:+f.capacity,driver:!!f.driver,people:[],backup:[],status:'Open'});close();go('Schedule');update('Task created; assign coverage')}function assign(id){let x=s.shifts.find(y=>y.id===id),names=['Maya','Alex','Sam'].filter(n=>eligible(n,x));openModal(`<h2>Assign ${esc(x.title)}</h2><p>Eligible volunteers match the task requirements and have no overlapping assignments. Alex and Sam have sample driver approval and flexible availability.</p><form onsubmit="doAssign(event,${id})"><label>Primary volunteer<select name="primary" required><option value="">Choose volunteer</option>${opts(names,x.people[0])}</select></label><label>Optional backup<select name="backup"><option value="">None</option>${opts(names,x.backup[0])}</select></label><button class="primary">Save assignment</button></form>`)}function doAssign(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),x=s.shifts.find(y=>y.id===id);if(f.primary===f.backup||!eligible(f.primary,x)||(f.backup&&!eligible(f.backup,x)))return msg('Choose distinct eligible volunteers');x.people=[f.primary];x.backup=f.backup?[f.backup]:[];let o=s.offers.find(y=>y.id===x.offer);if(o){o.status='Scheduled';o.history.push('Assigned '+f.primary)}s.alerts=s.alerts.filter(a=>a.id!==id);close();update('Schedule updated')}
function render(){let pages=role==='Public'?['Home','Find Food','Volunteer','Donate Food']:role==='Volunteer'?['My Dashboard','Browse Shifts']:['Overview','Donations','Schedule','Volunteers','Reports','Website Information'];document.body.dataset.role=role;document.body.dataset.page=page;document.querySelectorAll('.roles button').forEach((b,i)=>b.classList.toggle('selected',i===['Public','Volunteer','Staff'].indexOf(role)));$('nav').innerHTML=role==='Staff'?'':pages.map(p=>btn(p,`go('${p}')`)).join('');let h='';if(page==='Home')h=`<div class="hero"><div><p class="eyebrow">FOOD • PEOPLE • POSSIBILITY</p><h1>Good food. Helping hands. A stronger Bearkat community.</h1><p>A proposed community platform connecting food donations, volunteers and students with food resources.</p><div class="actions">${btn('Find Food',"go('Find Food')",true)}${btn('Find a Volunteer Shift',"go('Volunteer')")}${btn('Offer a Donation',"go('Donate Food')")}<p class="muted small">A student-led concept, not an official university service.</p></div></div><div class="heroart" aria-hidden="true"><svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg"><rect x="80" y="20" width="190" height="145" rx="8" fill="#e5e8dc"/><path d="M90 70H260M90 115H260" stroke="#9da99a" stroke-width="4"/><g fill="#a94b30"><rect x="105" y="37" width="26" height="30" rx="3"/><rect x="205" y="80" width="28" height="31" rx="3"/></g><g fill="#79967e"><rect x="150" y="38" width="34" height="29" rx="3"/><rect x="115" y="83" width="35" height="28" rx="3"/></g><circle cx="62" cy="57" r="21" fill="#d6a58b"/><path d="M41 53Q35 21 65 29Q87 28 83 56L72 43L45 47Z" fill="#18343c"/><path d="M35 91Q61 75 88 91L108 159H22Z" fill="#a94b30"/><circle cx="255" cy="59" r="21" fill="#d6a58b"/><path d="M233 57Q226 27 255 29Q285 29 280 77L266 70L270 48L242 45Z" fill="#18343c"/><path d="M230 90Q255 77 280 91L302 159H212Z" fill="#79967e"/><path d="M74 105L120 143M242 105L202 143" stroke="#d6a58b" stroke-width="15" stroke-linecap="round"/><rect x="110" y="128" width="100" height="42" rx="5" fill="#18343c"/><path d="M132 128Q110 99 137 108L151 128M165 128Q163 94 183 105L185 128" fill="#79967e"/><path d="M20 173H302" stroke="#a94b30" stroke-width="12"/><path d="M40 180V215M282 180V215" stroke="#18343c" stroke-width="10"/></svg></div></div><div class="notice"><strong>Service notice</strong><br>${esc(s.info.expiry>=day?s.info.announcement:"No active service announcements.")}</div><div class="sectionhead"><h2>A little time can make a difference.</h2>${btn('See all opportunities',"go('Volunteer')")}</div><div class="grid home-shifts">${s.shifts.filter(x=>status(x)==='Open').slice(0,3).map(shiftCard).join('')}</div><section><h2>How food recovery works</h2><div class="grid"><div><h3>01 · Offer</h3>Retailers share available food.</div><div><h3>02 · Coordinate</h3>Staff review and schedule approved volunteers.</div><div><h3>03 · Receive</h3>Staff verify delivery to the pantry.</div></div></section>`;else if(page==='Find Food')h=`<h1>Food support is for you, too.</h1><p>You deserve access to food. This demo connects you to existing university services rather than collecting student information.</p><section class="resource"><h3>Shop the SHSU Food Pantry</h3><p>Use the university’s existing PantrySoft system to register, browse food and arrange pickup.</p><a href="https://app.pantrysoft.com/login/shsu" target="_blank" rel="noopener">Open official PantrySoft</a></section><section class="resource"><h3>Swipe Out Hunger</h3><p>Visit the official pantry page for the meal assistance eligibility survey.</p><a href="https://www.shsu.edu/academics/colleges/health-sciences/food-pantry" target="_blank" rel="noopener">Official pantry page and survey</a></section><section class="resource"><h3>Plan your visit</h3><p>Published location: 1108 17th Street, Huntsville. Published hours: Monday–Thursday, 9 AM–5 PM. Check the official page before visiting.</p><p>936-294-4441 · foodpantry@shsu.edu</p><a href="https://www.shsu.edu/academics/colleges/health-sciences/food-pantry" target="_blank" rel="noopener">Verify current information and policies</a></section><section><h3>Sample local announcement</h3><p>${esc(s.info.announcement)}</p><p>${esc(s.info.faq)}</p></section>`;else if(page==='Donate Food')h=`<section>${offerForm()}</section>`;else if(['Volunteer','Browse Shifts'].includes(page))h=`<h1>Find a volunteer shift</h1><p>Choose a task that fits your schedule.</p><section class="grid"><label>Date<input id="fd" type="date" onchange="filter()"></label><label>Time<select id="ft" onchange="filter()">${opts(['Any','Morning','Afternoon'])}</select></label><label>Task<select id="fy" onchange="filter()">${opts(['Any','Pickup','Sorting','Stocking','Packing','Outreach'])}</select></label><label>Spaces<select id="fs" onchange="filter()">${opts(['Any','Open only'])}</select></label><label><input id="fm" type="checkbox" style="width:auto" onchange="filter()"> Matches Maya’s availability</label></section><div class="calbar"><div>${btn('Calendar view',"setView('Calendar')",viewMode==='Calendar')} ${btn('List view',"setView('List')",viewMode==='List')}</div><span class="muted">Select any shift for details.</span></div><div id="results"></div>`;else if(page==='My Dashboard'){let mine=s.shifts.filter(x=>x.people.includes('Maya'));h=`<p class="eyebrow">VOLUNTEER PORTAL / SAMPLE ACCOUNT</p><h1>Hi, Maya.</h1><p>Your time, your commitments, all in one place.</p><div class="nextshift"><strong>Next shift:</strong> ${esc(mine.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))[0]?.title||'No upcoming shifts')}</div><h2>My shifts</h2>${mine.map(x=>`<section><h3>${esc(x.title)}</h3>${x.date} · ${x.start}–${x.end} ${tag(x.confirmed?'Attendance confirmed':'Assigned')}<div class="actions">${btn('Confirm attendance',`confirmShift(${x.id})`,true)}${btn('View instructions',`details(${x.id})`)}${btn('Cancel shift',`cancelShift(${x.id})`)}${btn('Report a problem',`problem(${x.id})`)}${s.completions.some(c=>c.id===x.id)?tag(s.completions.find(c=>c.id===x.id).verified?'Verified':'Pending verification'):btn('Submit completion',`complete(${x.id})`)}</div></section>`).join('')||'<p>No assigned shifts.</p>'}<section><h3>Backup commitments</h3>${s.shifts.filter(x=>x.backup.includes('Maya')).map(x=>`<p>${esc(x.title)} · Await staff confirmation</p>`).join('')||'No backup commitments.'}</section><div class="grid"><section><h3>Weekly availability</h3>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>`<label><input style="width:auto" type="checkbox" ${s.availability.includes(d)?'checked':''} onchange="availability('${d}',this.checked)"> ${d}</label>`).join('')}</section><section><h3>Training & approvals</h3><p>General orientation: ${tag('Approved')}</p><p>Driver eligibility: ${tag('Not approved')}</p><label><input type="checkbox" style="width:auto" ${s.willing?'checked':''} onchange="s.willing=this.checked;save()"> Willing to drive</label>${btn(s.requested?'Request pending':'Request driver approval','requestApproval()')}<h3>Notifications</h3><label><input type="checkbox" style="width:auto" ${s.notify?'checked':''} onchange="s.notify=this.checked;save()"> Simulated reminders</label><h3>Verified hours</h3>${hours('Maya')} hours</section></div>`}else if(page==='Overview'){let counts=[['Offers awaiting review',s.offers.filter(o=>o.status==='Awaiting review').length,'Donations'],['Unfilled pickups',s.shifts.filter(x=>x.type==='Pickup'&&!x.people.length&&x.status!=='Cancelled').length,'Schedule'],['Today’s scheduled pickups',s.shifts.filter(x=>x.type==='Pickup'&&x.date===day&&x.people.length).length,'Schedule'],['Completions awaiting verification',s.completions.filter(c=>!c.verified).length,'Reports']];h=`<h1>What needs attention today?</h1><p>Wednesday, November 25 · Sample operations</p><div class="grid">${counts.map(([t,n,p])=>`<div class="card"><div style="font-size:32px;font-weight:700">${n}</div><p>${t}</p>${btn('Review',`go('${p}')`)}</div>`).join('')}</div><section><h2>Action center</h2>${s.alerts.map(a=>`<p>${esc(a.text)} ${btn('Resolve',a.id?`go('${a.page}');assign(${a.id})`:`go('${a.page}')`)}</p>`).join('')}${s.offers.filter(o=>o.status==='Awaiting review').map(o=>`<p>New offer: ${esc(o.business)} ${btn('Review',`review(${o.id})`)}</p>`).join('')}${s.shifts.filter(x=>x.type==='Pickup'&&!x.people.length).map(x=>`<p>Missing driver: ${esc(x.title)} ${btn('Assign',`assign(${x.id})`)}</p>`).join('')}</section><h2>Today’s schedule</h2>${schedule(s.shifts.filter(x=>x.date===day))}`}else if(page==='Donations')h=`<h1>Donation offers</h1>${btn('Enter phone offer',"openModal(offerForm())",true)}${s.offers.map(o=>`<section><h3>${esc(o.business)}</h3>${tag(o.status)}<p>${esc(o.food)} · ${esc(o.quantity)} · ${o.date}</p>${btn('Review offer',`review(${o.id})`)} ${o.status==='Accepted, needs coverage'?btn('Create pickup',`createShift(${o.id})`,true):''}</section>`).join('')}`;else if(page==='Schedule')h=`<h1>Schedule</h1>${btn('Create shift','createShift()',true)}${calendar(s.shifts)}${schedule(s.shifts)}`;else if(page==='Volunteers')h=`<h1>Volunteers</h1>${['Maya','Alex','Sam'].map(n=>`<section><h3>${n}</h3><p>Orientation approved · Driver ${n==='Maya'?'not approved':'approved'} · ${n==='Maya'?esc(s.availability.join(', ')):'Flexible sample availability'}</p>${n==='Maya'&&s.requested?'Driver approval request pending external verification.':''}</section>`).join('')}`;else if(page==='Reports')h=`<h1>Reports & verification</h1><div class="grid"><div class="card">Completed pickups<h2>${s.offers.filter(o=>o.status==='Received and verified').length}</h2></div><div class="card">Missed pickups<h2>${s.offers.filter(o=>['Unable to collect','Cancelled'].includes(o.status)).length}</h2></div><div class="card">Verified hours<h2>${hours()}</h2></div></div><section><h2>Completion records</h2>${s.completions.map((c,i)=>`<p>${esc(s.shifts.find(x=>x.id===c.id)?.title)} · ${esc(c.person)} · ${esc(c.hours)} hours · ${esc(c.outcome)} · ${esc(c.notes)} ${c.verified?tag('Verified'):btn('Verify receipt & hours',`verify(${i})`,true)}</p>`).join('')||'No completion records yet.'}</section>`;else if(page==='Website Information')h=`<h1>Website information</h1><section><form id="contentForm" onsubmit="saveContent(event)">${Object.entries(s.info).map(([k,v])=>field(k,k[0].toUpperCase()+k.slice(1),v,k==='expiry'?'date':'text')).join('')}<div class="actions"><button type="button" onclick="previewContent()">Preview announcement</button><button class="primary">Save changes</button></div></form></section>`;$('app').innerHTML=role==='Staff'?`<div class="layout"><aside class="side">${pages.map(p=>btn(p,`go('${p}')`,p===page)).join('')}</aside><div>${h}</div></div>`:h;if($('results'))filter()}
function hours(n){return s.completions.filter(c=>c.verified&&(!n||c.person===n)).reduce((a,c)=>a+Number(c.hours),0)}function schedule(xs){return `<section class="scroll"><table><thead><tr><th>Time / task</th><th>Primary</th><th>Backup</th><th>Status</th><th>Action</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${x.date} ${x.start}–${x.end}<br>${esc(x.title)}</td><td>${esc(x.people.join(', ')||'Unassigned')}</td><td>${esc(x.backup.join(', ')||'None')}</td><td>${tag(s.offers.find(o=>o.id===x.offer)?.status||status(x))}</td><td>${x.status==='Cancelled'?'—':btn('Assign',`assign(${x.id})`)} ${x.people.length&& !x.people.includes('Maya')&&!s.completions.some(c=>c.id===x.id)?btn('Simulate completion',`staffComplete(${x.id})`):''}</td></tr>`).join('')}</tbody></table></section>`}function staffComplete(id){let x=s.shifts.find(y=>y.id===id);s.completions.push({id,person:x.people[0],hours:duration(x)/60,outcome:'Collected / completed',notes:'Simulated volunteer report',verified:false});let o=s.offers.find(y=>y.id===x.offer);if(o)o.status='Collected';update('Simulated volunteer completion pending verification')}function filter(){let xs=s.shifts.filter(x=>(!$('fd').value||x.date===$('fd').value)&&($('ft').value==='Any'||($('ft').value==='Morning'?x.start<'12:00':x.start>='12:00'))&&($('fy').value==='Any'||x.type===$('fy').value)&&($('fs').value==='Any'||status(x)==='Open')&&(!$('fm').checked||eligible('Maya',x)));if(viewMode==='Calendar'){if($('fd').value)calMonth=$('fd').value.slice(0,7);$('results').innerHTML=calendar(xs);return}$('results').innerHTML=[...new Set(xs.map(x=>x.date))].sort().map(d=>`<h2>${d}</h2><div class="grid">${xs.filter(x=>x.date===d).map(shiftCard).join('')}</div>`).join('')||'<section>No matching shifts. Try changing filters.</section>'}function setView(v){viewMode=v;filter()}function moveMonth(n){let d=new Date(calMonth+'-01T12:00');d.setMonth(d.getMonth()+n);calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if($('fd'))$('fd').value='';if($('results'))filter();else render()}function calendar(xs){let d=new Date(calMonth+'-01T12:00'),offset=d.getDay(),total=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells=[];for(let i=0;i<Math.ceil((offset+total)/7)*7;i++){let n=i-offset+1,valid=n>0&&n<=total,date=calMonth+'-'+String(n).padStart(2,'0');cells.push(`<div class="calday ${valid?'':'calblank'}">${valid?`<strong>${n}</strong>`+xs.filter(x=>x.date===date).sort((a,b)=>a.start.localeCompare(b.start)).map(x=>`<button class="calevent ${x.type} ${status(x)==='Open'?'':'closed'}" onclick="details(${x.id})"><strong>${x.start}–${x.end}</strong><br>${esc(x.title)}<br>${status(x)==='Open'?Math.max(0,x.capacity-x.people.length)+' spaces':status(x)}</button>`).join(''):''}</div>`)}return `<div class="calbar">${btn('Previous month','moveMonth(-1)')}<h2>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>${btn('Next month','moveMonth(1)')}</div><div class="calwrap" tabindex="0" aria-label="Monthly volunteer calendar, scroll horizontally on small screens"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div></div><p class="muted">Orange: pickup · Green: sorting / stocking · Blue: packing · Purple: outreach. ${xs.some(x=>x.date.startsWith(calMonth))?'':'No matching shifts this month.'}</p>`}function confirmShift(id){s.shifts.find(x=>x.id===id).confirmed=true;update('Attendance confirmed')}function problem(id){let reason=prompt('Describe the problem (sample only)');if(reason){s.alerts.push({text:reason,page:'Schedule',id});update('Simulated report sent')}}function availability(d,v){s.availability=v?[...new Set([...s.availability,d])]:s.availability.filter(x=>x!==d);save()}function previewContent(){let f=Object.fromEntries(new FormData($('contentForm')));openModal(`<h2>Public announcement preview</h2><div class="notice">${esc(f.announcement)}</div><p>Expires ${esc(f.expiry)}</p>`)}function saveContent(e){e.preventDefault();s.info=Object.fromEntries(new FormData(e.target));update('Public information saved')}render();</script></html>
